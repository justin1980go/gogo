<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="查詢台灣城市或景點，依日期與旅遊條件在網頁查看多日行程與晴雨備案。"><title>台灣旅遊規劃室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d4c59'/%3E%3Cpath d='M8 23L16 7l8 16-8-4z' fill='%23f6c75c'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script src="./config.js"></script></head>
<body><script defer src="./app.bundle.js"></script><header class="top"><a class="brand" href="./index.html"><span class="mark">↗</span>台灣旅遊規劃室<span class="edition">TAIWAN / LIVE SEARCH</span></a><span class="mode" id="mode">線上服務尚未設定</span></header>
<main><section class="intro"><p class="eyebrow">把假期，留給喜歡的地方。</p><h1>下一站，想去哪裡？</h1><p>選一個城市，安排剛剛好的路線。晴天出走，下雨也有備案。</p></section>
<div class="workspace"><aside class="panel"><form id="planner"><div class="section-label"><span>01</span><h2>設定這趟旅行</h2></div><label>城市或景點<input name="destination" id="destination" value="台北" maxlength="80" required placeholder="例如：台北、蘭陽博物館"></label><div class="quick" aria-label="快速選擇"><button type="button" data-city="花蓮">花蓮</button><button type="button" data-city="日月潭">日月潭</button><button type="button" data-city="台中">台中</button><button type="button" data-city="高雄">高雄</button></div><label>出發日期<input type="date" name="date" id="date" required></label><label>旅遊天數<select name="days"><option value="1">1 天</option><option value="2">2 天 1 夜</option><option value="3">3 天 2 夜</option><option value="4">4 天 3 夜</option><option value="5">5 天 4 夜</option></select><small>多日以同一旅遊區住宿規劃；住宿自訂，費用另計。每天沿用下方活動時段。</small></label><div class="row"><label>出發地<input name="origin" value="台北車站" maxlength="80" required></label><label>交通方式<select name="transport"><option value="transit">大眾運輸</option><option value="drive">自駕</option></select></label></div><div class="row"><label>出門時間<input type="time" name="start" value="09:00" required></label><label>每日結束／末日返家<input type="time" name="end" value="18:00" required></label></div><label>單程交通預留時間（分鐘）<input type="number" name="transfer" value="45" min="0" max="360" step="5" required><small>出發地至旅遊區的單程時間，請依導航調整。</small></label><div class="row"><label>同行人數<input type="number" name="people" value="2" min="1" max="20" required></label><label>全程預算（元，不含住宿）<input type="number" name="budget" value="3000" min="100" max="100000" step="100" required></label></div><div class="row"><label>同行者<select name="group"><option>成人同行</option><option>親子同行</option><option>長輩同行</option></select></label><label>步行強度<select name="pace"><option value="easy">輕鬆慢走</option><option value="normal">一般步調</option></select></label></div><label>旅遊偏好<select name="interest"><option value="culture">文化與建築</option><option value="nature">戶外散步</option><option value="family">親子探索</option><option value="shopping">大型購物中心</option></select></label><label>不安排的景點（選填）<input name="exclude" maxlength="120" placeholder="以逗號分隔景點名稱"></label><button class="primary" type="submit" id="generate">查詢並規劃 <span>↗</span></button><p class="form-note">輸入台灣城市、行政區或景點。需先設定線上服務；資料不足時會提示調整，不保證每個地點都有合適行程。</p></form></aside>
<section class="results" aria-label="規劃結果"><div id="status" role="status" aria-live="polite"></div><div id="output"><div class="empty"><h2>正在載入旅遊規劃室</h2><p>若此提示持續顯示，請重新解壓縮完整資料夾，再開啟 index.html。</p><noscript>請開啟瀏覽器的 JavaScript，才能產生行程。</noscript></div></div></section></div>
<footer>台灣旅遊規劃室 <span>行程是旅行的起點，出發前請再確認開放與交通資訊。</span><a href="./services.html">服務設定與版本範圍</a></footer></main></body></html>
